# Deliberately built from primitives rather than meshes, with the reason.
# `ruibench validate` treats these as satisfied: a primitive is not a missing
# asset, it is a chosen one.
primitives:
  plate: "Isaac's YCB subset ships no 029_plate; a shallow cylinder stands in. It has no rim -- remember that when reading Fine-Grained placement results."
  ball: "Isaac's YCB subset ships no ball; a sphere primitive is geometrically exact and shades photorealistically."
  stove: "a flat plate-sized surface, distinguished from the plate by colour and position (DI4)."
  basket: "an open bin of five boxes (20 x 30 x 8 cm, 1 cm walls). Isaac's KLT bin has a collision scope authored ~100x too large, and sorting by colour needs bins that can be coloured."
