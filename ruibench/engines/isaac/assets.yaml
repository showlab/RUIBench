# Asset catalogue: logical name -> USD on the Isaac asset server.
#
# HAND-MAINTAINED.  No tool writes this file: verification results and measured
# geometry go to assets.lock.json next to it.
#
# `{NUCLEUS}` expands to the resolved asset root (Isaac Sim's
# `/persistent/isaac/asset_root/cloud`, or RUIBENCH_ISAAC_NUCLEUS for a local
# mirror), with `/Isaac` appended -- the same layout Isaac Lab uses.
#
# physics: builtin -- the USD ships with a rigid body and colliders.
# physics: added   -- the USD is visual only (most of Isaac's YCB props are);
#                     RUIBench applies a rigid body and colliders at spawn time.
# collision: hull          -- convex hull, for solid things.
# collision: decomposition -- convex decomposition, for hollow things.  A hull
#                     fills a bowl in, and "the ball is in the bowl" would then
#                     be false while it looks true.
# footprint: round -- seen from above it is a disc; containment is tested
#                     against a circle.  Default is a rectangle.
# up: y            -- the USD is authored Y-up (every Isaac YCB prop is: the
#                     soup can's 10.2 cm height lies along y).  The engine stands
#                     it up at spawn and turns that back out when it reports
#                     poses, so task code always sees "standing = identity".
#                     Which way is up is a fact about the asset, not something a
#                     heuristic can infer: "lowest orientation" lays a can down.
#
# Measured geometry -- half extents in the upright frame, and whether an 8 cm
# parallel gripper can close across the object -- is in assets.lock.json,
# written by `python -m ruibench.engines.isaac.checks geometry`.
#
# Only what a task shows is listed (v16 dropped 52 entries no task used, the
# first props among them: Isaac's YCB cans and boxes, the KLT bin, the cabinet).
